# GitHub Pages Deployment for Hugo SeoTax Theme
#
# Builds exampleSite/ by symlinking the repo root as themes/seotax/
# so Hugo resolves all theme paths correctly, then deploys to GitHub Pages.
#
# Setup:
#   1. Go to repository Settings > Pages
#   2. Under "Build and deployment", select "GitHub Actions" as the Source
#   3. Push to the main branch to trigger deployment

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Setup Dart Sass
        timeout-minutes: 5
        shell: bash
        env:
          DART_SASS_VERSION: "1.108.1"
        run: |
          # Hugo requires the embedded protocol, which npm's sass package does not support.
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/dart-sass.tar.gz"
          tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dart-sass/sass" --embedded --version | jq -e 'select(.protocolVersion and .compilerVersion)'

      - name: Build with Hugo
        timeout-minutes: 5
        working-directory: exampleSite
        run: |
          mkdir -p themes
          ln -sf ../.. themes/seotax
          mkdir -p i18n
          cp -R ../i18n/. i18n/
          hugo --minify --baseURL "https://minyeamer.github.io/hugo-seotax/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
