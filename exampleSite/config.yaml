# SeoTax Example Site
# Local preview: cd exampleSite && mkdir -p themes && ln -sf ../.. themes/seotax && hugo server --minify
# GitHub Pages: push to main branch — .github/workflows/deploy.yml handles the build

baseURL: "https://minyeamer.github.io/hugo-seotax/"
title: "SeoTax Demo"
description: "Example site for the Hugo SeoTax theme"
copyright: "[© CC BY 4.0](https://creativecommons.org/licenses/by/4.0/legalcode)"

theme: "seotax"
defaultContentLanguage: "en"
languageCode: "en"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

# Recommended: disable per-tag static pages (SeoTax uses dynamic search instead)
disableKinds: ["term"]

minify:
  disableXML: true
  minifyOutput: true

# SEO-friendly URL structure
permalinks:
  posts: "/blog/:slugorcontentbasename/"

# Multi-lingual mode config
# See https://gohugo.io/content-management/multilingual/#translation-by-content-directory
languages:
  en:
    languageName: "English"
    contentDir: "content.en"
    weight: 1
    params:
      menu:
        categoryOrder:
          - name: "Guide"
            weight: 10
          - name: "Features"
            weight: 20
          - name: "Setup"
            weight: 30
  ko:
    languageName: "한국어"
    contentDir: "content.ko"
    weight: 2
    params:
      menu:
        categoryOrder:
          - name: "시작하기"
            weight: 10
          - name: "콘텐츠 작성"
            weight: 20
          - name: "기능"
            weight: 30
          - name: "Shortcodes"
            weight: 40
          - name: "커스터마이징"
            weight: 50
          - name: "참고"
            weight: 60

markup:
  goldmark:
    extensions:
      typographer:
        disable: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  author: "SeoTax"
  keywords: ["blog", "Hugo", "SeoTax", "theme"]

  posts:
    section: "posts"
    sort: "oldest" # ["newest" | "oldest" | "disabled"]

  search:
    enabled: true
    sort: "relevance" # ["relevance" | "newest" | "oldest" | "disabled"]

  assets:
    favicon: "/favicon.svg"
    favicon16x16: "/favicon.png"
    favicon32x32: "/favicon.png"
    apple_touch_icon: "/favicon.png"
    safari_pinned_tab: "/favicon.svg"

  # Sidebar menu
  menu:
    profileImage: "/profile.svg"
    categories: true
    recentPosts: true

  social:
    github: "https://github.com/minyeamer/hugo-seotax"
    # twitter: "https://x.com/your-account"

  # comments:
  #   enabled: true
  #   provider: "giscus" # "disqus"
  #   disqus:
  #     shortname: "your-disqus-shortname"
  #   giscus:
  #     repo: "[ENTER REPO HERE]"
  #     repoId: "[ENTER REPO ID HERE]"
  #     category: "[ENTER CATEGORY NAME HERE]"
  #     categoryId: "[ENTER CATEGORY ID HERE]"
  #     mapping: "pathname"
  #     inputPosition: "bottom"

  # i18n: the theme ships its own i18n files under themes/seotax/i18n/
  # When running standalone, Hugo auto-discovers them from the theme.
  # Only set i18nDir if you need to override the translations.
  # i18nDir: "themes/seotax/i18n"

  images:
    rootPath: "_images"
    maxImageSize: 1920
    roundedCorners: false
    rotateLandscapeImages: true

  # Enable Hugo portable links for relative Markdown links and images
  # portableLinks: true

  # PWA Service Worker ("precache" to enable)
  serviceWorker: "precache"

  # Table of Contents
  tableOfContents:
    startLevel: 2
    endLevel: 3

  # Optional per-page ToC toggle default
  # toc:
  #   enabled: true

  # Google Analytics
  # GoogleAnalytics:
  #   tagId: "G-XXXXXXXXXX"

  # Search engine verification
  # searchEngine:
  #   google:
  #     siteVerificationTag: "your-code"
  #   naver:
  #     siteVerificationTag: "your-code"
  #   bing:
  #     siteVerificationTag: "your-code"
  #   yandex:
  #     siteVerificationTag: "your-code"

  # Schema.org structured data
  schema:
    publisherType: "Person"
    sameAs:
      - "https://github.com/minyeamer"
